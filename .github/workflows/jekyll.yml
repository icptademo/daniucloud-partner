name: Build Jekyll site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build with the GitHub Pages gem
        run: bundle exec jekyll build
      - name: Check project Pages baseurl and required pages
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/feed.xml
          test -f _site/sitemap.xml
          test -f _site/about/index.html
          test -f _site/tags/index.html
          test -f _site/2026/11/who-fits-cloud-partner/index.html
          test -f _site/2026/11/choose-cooperation-model/index.html
          test -f _site/2026/11/commission-reconciliation-checklist/index.html
          test -f _site/2026/11/white-label-and-sub-agents/index.html
          test -f _site/2026/11/compliant-account-opening/index.html
          test -f _site/2026/11/top-up-arrival-check/index.html
          grep -q '/daniucloud-partner/assets/css/style.css' _site/index.html
          grep -q 'https://icptademo.github.io/daniucloud-partner/' _site/feed.xml
          grep -q 'https://icptademo.github.io/daniucloud-partner/' _site/sitemap.xml
          if grep -R -E -n '(href|src)="/[a-zA-Z0-9]' _site --include='*.html' | grep -v '/daniucloud-partner/'; then
            echo "Found a root-absolute link that skips baseurl"
            exit 1
          fi
          if grep -R "免实名" _site --include='*.html'; then
            echo "Disallowed phrase found in the built site"
            exit 1
          fi
